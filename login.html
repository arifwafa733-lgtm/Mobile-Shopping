<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shopping | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111827, #312e81, #6d28d9);
        }

        .login-box {
            width: 390px;
            max-width: 92%;
            padding: 40px 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6d28d9;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #342bad;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #31138a;
        }

        .message {
            background: #fee2e2;
            color: #5a1d1d;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #424b59;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">📱</div>

    <h2>Mobile Shopping</h2>
    <p class="subtitle">Welcome Login to your account</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">

        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter your username" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit">LOGIN</button>

    </form>

    <div class="footer">
        Mobile Shopping 
        <br><br>
        All Rights Reserved
    </div>

</div>

</body>
</html>
